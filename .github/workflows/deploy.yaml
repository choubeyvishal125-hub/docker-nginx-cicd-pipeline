name: Website CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-website:latest .

      - name: Test Nginx configuration
        run: docker run --rm devops-website:latest nginx -t
